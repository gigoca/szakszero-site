const rowsEl = document.getElementById("rows");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
const qEl = document.getElementById("q");
const sourceEl = document.getElementById("source");
const dateFromEl = document.getElementById("dateFrom");
const dateToEl = document.getElementById("dateTo");

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function render() {
  const q = qEl.value.trim().toLowerCase();
  const source = sourceEl.value;
  const dateFrom = dateFromEl.value;
  const dateTo = dateToEl.value;
  const filtered = ARTICLES.filter((a) => {
    if (source && a.source !== source) return false;
    if (dateFrom && a.date < dateFrom) return false;
    if (dateTo && a.date > dateTo) return false;
    if (!q) return true;
    return (a.title + " " + a.summary).toLowerCase().includes(q);
  });
  rowsEl.innerHTML = filtered.map((a) => `
    <tr>
      <td>${a.date}</td>
      <td>${escapeHtml(a.source)}</td>
      <td><a href="${a.url}" target="_blank" rel="noopener">${escapeHtml(a.title)}</a></td>
      <td class="summary">${escapeHtml(a.summary)}</td>
    </tr>
  `).join("");
  countEl.textContent = filtered.length + " / " + ARTICLES.length + " cikk";
  emptyEl.style.display = filtered.length ? "none" : "block";
}

qEl.addEventListener("input", render);
sourceEl.addEventListener("change", render);
dateFromEl.addEventListener("change", render);
dateToEl.addEventListener("change", render);
render();
</script>
